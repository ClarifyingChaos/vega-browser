name: macOS Compatibility Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # FORK: unit tests and the check scripts, which no workflow ran. The sync gate depends on them.
  tests:
    name: Unit tests and checks
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: VegaTabsCore unit tests
        working-directory: Packages/VegaTabsCore
        run: swift test

      - name: Check scripts
        run: SKIP_GUI_CHECKS=1 python3 scripts/run-checks.py

  build:
    name: Build on macOS 26
    # Same runner and default Xcode as the release workflow.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Ensure Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build without signing secrets
        run: |
          xcodebuild -scheme Vega -configuration Release -arch arm64 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_CODE_COVERAGE=NO \
            CLANG_COVERAGE_MAPPING=NO

      - name: Ad-hoc sign and pack
        run: |
          codesign --force --deep --sign - build/Build/Products/Release/Vega.app
          ditto -c -k --keepParent build/Build/Products/Release/Vega.app Vega.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Vega
          path: Vega.zip
          retention-days: 1

  checks:
    name: Checks on macOS 26
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run checks
        run: scripts/run-checks.sh

  launch-sequoia:
    name: Launch on macOS 15
    needs: build
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Vega

      # Through LaunchServices, so LSMinimumSystemVersion is checked too. A macOS 26 framework
      # linked strongly fails here in dyld, before any availability check runs.
      - name: Launch and stay up for 20 seconds
        run: |
          ditto -x -k Vega.zip .
          open -g --stdout "$PWD/vega.log" --stderr "$PWD/vega.log" Vega.app
          sleep 20
          if ! pgrep -x Vega; then cat vega.log; exit 1; fi
          pkill -x Vega
