name: Sync upstream

# FORK: keeps `develop` a renamed mirror of the upstream project and offers its new commits to `main` as a pull
# request. `develop` is the upstream history rewritten into Vega's names by scripts/upstream/transform.py. The rewrite
# is deterministic, so a commit has the same hash every day and `develop` only ever fast-forwards. Merging stays a
# human decision.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      # The hashes depend on the tool's version: keep it the same as the one used for the first rewrite.
      - name: Install git-filter-repo
        run: pip install git-filter-repo==2.47.0
      - name: Rewrite the upstream history into Vega's names
        run: |
          git clone --branch develop --single-branch --no-tags https://github.com/nook-browser/Nook.git ../upstream
          python3 scripts/upstream/transform.py ../upstream
      # The job's own token may not push commits that change workflow files, and the upstream project's do. A deploy key
      # (a write key for this repository only, kept as the SYNC_DEPLOY_KEY secret) may.
      - name: Fast-forward develop
        env:
          SYNC_DEPLOY_KEY: ${{ secrets.SYNC_DEPLOY_KEY }}
        run: |
          git fetch ../upstream develop:refs/remotes/renamed/develop
          git fetch origin develop
          if ! git merge-base --is-ancestor origin/develop renamed/develop; then
            echo "develop is not an ancestor of the renamed upstream: the rewrite rules or the tool changed, or the upstream history was rewritten."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SYNC_DEPLOY_KEY" > ~/.ssh/sync_key
          chmod 600 ~/.ssh/sync_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/sync_key -o IdentitiesOnly=yes" \
            git push "git@github.com:${GITHUB_REPOSITORY}.git" renamed/develop:refs/heads/develop
          rm -f ~/.ssh/sync_key
      - name: Open or refresh the pull request into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          if [ "$(git rev-list --count origin/main..origin/develop)" = "0" ]; then echo "main is up to date"; exit 0; fi
          if gh pr list --base main --head develop --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create --base main --head develop --title "Sync upstream" \
              --body "New commits from the upstream project, renamed. Review, resolve conflicts (keep com.vega.browser and // FORK: code), merge, then run scripts/release.sh."
          fi
